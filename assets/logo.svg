<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="300" height="300">
  <defs>
    <!-- बिना किसी बॉर्डर के बिल्कुल गोल काटने के लिए क्लिप पाथ -->
    <clipPath id="clean-circle">
      <circle cx="500" cy="500" r="495" />
    </clipPath>
  </defs>

  <g clip-path="url(#clean-circle)">
    <!-- मुख्य काला बैकग्राउंड (बिना बॉर्डर के) -->
    <circle cx="500" cy="500" r="495" fill="#000000" />

    <!-- बाईं ओर का लाल हिस्सा (सफेद आकृति से पूरी तरह जुड़ा हुआ) -->
    <polygon points="0,330 665,330 640,445 290,445 205,940 0,940" fill="#FF0000" />

    <!-- सफेद रंग का 'P' अक्षर -->
    <path d="M 80,202 
             L 650,202 
             C 740,202 785,265 785,355 
             C 785,485 695,585 575,585 
             L 378,585 
             L 310,975 
             L 190,975 
             L 278,438 
             L 632,438 
             L 652,332 
             L 20,332 Z" 
          fill="#FFFFFF" />
  </g>
</svg>
